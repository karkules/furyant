            const bd = document.getElementById("nav-backdrop");
            const dr = document.getElementById("nav-drawer");
            document.documentElement.classList.toggle("nav-open", opened);
            if (t) {

                t.setAttribute(

                main.style.marginTop = navBottom + "px";

                let collapsed = false;
                const collapse = () => {
                    if (collapsed) return;
                    collapsed = true;
                    main.style.marginTop = "0px";

            });
        }
    })();
